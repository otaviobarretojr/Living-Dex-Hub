name: Build Living Dex APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'data/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.LIVINGDEX_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.LIVINGDEX_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: livingdex
      RELEASE_KEY_PASSWORD: ${{ secrets.LIVINGDEX_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Restore canonical app HTML
        run: |
          python3 - <<'PY'
          import gzip,base64,pathlib
          root=pathlib.Path('app/src/main/assets'); parts=[root/'index.part00',root/'index.part01x0',root/'index.part01x1',root/'index.part01x2',root/'index.part01x3',root/'index.part02',root/'index.part03',root/'index.part04']
          sizes=[p.stat().st_size for p in parts]; assert sizes==[20000,6500,6500,6500,500,20000,20000,864],sizes
          packed=''.join(p.read_text().strip() for p in parts); assert len(packed)==80864
          out=root/'index.html'; out.write_bytes(gzip.decompress(base64.b64decode(packed))); assert out.stat().st_size==223467
          PY
      - name: Build complete offline Pokédex Data Pack
        run: python3 tools/build_embedded_dex_pack.py
      - name: Inject all 12 Pokédexes into app
        run: python3 tools/inject_embedded_dex_pack.py
      - name: Package and validate 1025 Pokemon sprites
        run: python3 tools/sync_pokemon_assets.py
      - name: Finalize frozen Core 1.0
        run: python3 tools/finalize_core1.py
      - name: Update runtime QA for complete offline pack
        run: python3 tools/patch_core1_runtime_qa.py
      - name: Apply UI 1.1 visual rework
        run: python3 tools/rework_ui_v1.py
      - name: Apply UI 1.2 screen-by-screen pass
        run: python3 tools/rework_ui_v1_2.py
      - name: Apply UI 1.3 Pokemon profile pass
        run: python3 tools/rework_ui_v1_3.py
      - name: Apply UI 1.4 Android integration pass
        run: python3 tools/rework_ui_v1_4.py
      - name: Static Core 1.0 validation
        run: python3 tools/validate_core1.py
      - name: UI regression validations
        run: |
          python3 tools/validate_ui_v1.py
          python3 tools/validate_ui_v1_2.py
          python3 tools/validate_ui_v1_3.py
      - name: Android release readiness validation
        run: python3 tools/validate_android_release.py
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('app/src/main/assets/index.html').read_text(); scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S); pathlib.Path('/tmp/livingdex.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/livingdex.js
      - name: Browser QA and persistence reopen test
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"; test -n "$CHROME"
          python3 -m http.server 8000 --directory app/src/main/assets >/tmp/livingdex-http.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 2
          "$CHROME" --headless=new --no-sandbox --disable-gpu --user-data-dir=/tmp/livingdex-profile --virtual-time-budget=14000 --dump-dom 'http://127.0.0.1:8000/index.html?qa=1' >/tmp/livingdex-qa.html
          grep -q 'data-qa-pass="1"' /tmp/livingdex-qa.html
          grep -q 'function androidHandleBack()' app/src/main/assets/index.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --user-data-dir=/tmp/livingdex-profile --virtual-time-budget=5000 --dump-dom 'http://127.0.0.1:8000/index.html?reopen=1' >/tmp/livingdex-reopen.html
          grep -q 'data-reopen-pass="1"' /tmp/livingdex-reopen.html
      - name: Seal CI validation marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html'); s=p.read_text(); assert 'const BUILD_QA_VALIDATED=false;' in s; p.write_text(s.replace('const BUILD_QA_VALIDATED=false;','const BUILD_QA_VALIDATED=true;',1))
          PY
          python3 tools/validate_core1.py
          python3 tools/validate_ui_v1.py
          python3 tools/validate_ui_v1_2.py
          python3 tools/validate_ui_v1_3.py
          python3 tools/validate_android_release.py
      - name: Build debug and unsigned release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Verify APK payloads
        run: |
          DEBUG=app/build/outputs/apk/debug/app-debug.apk
          RELEASE=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$DEBUG"; test -f "$RELEASE"
          for APK in "$DEBUG" "$RELEASE"; do
            COUNT=$(zipinfo -1 "$APK" | grep -E '^assets/assets/pokemon/[0-9]+\.png$' | wc -l); test "$COUNT" -eq 1025
            unzip -p "$APK" assets/index.html | grep -q 'BUILD_QA_VALIDATED=true'
            unzip -p "$APK" assets/index.html | grep -q 'living-dex-ui" content="1.4"'
            unzip -p "$APK" assets/index.html | grep -q 'function androidHandleBack()'
          done
      - name: Generate SHA-256
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > app/build/outputs/apk/release/app-release-unsigned.apk.sha256
      - name: Upload validated Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LivingDexHub-v1.4.0-Android-Validated
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          if-no-files-found: error
      - name: Prepare private production keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_STORE_PASSWORD != '' && env.RELEASE_KEY_PASSWORD != '' }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/livingdex-production.jks"
          chmod 600 "$RUNNER_TEMP/livingdex-production.jks"
      - name: Build signed production release
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_STORE_PASSWORD != '' && env.RELEASE_KEY_PASSWORD != '' }}
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/livingdex-production.jks
        run: |
          rm -f app/build/outputs/apk/release/app-release.apk
          gradle :app:assembleRelease --rerun-tasks --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
      - name: Verify modern APK signature
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_STORE_PASSWORD != '' && env.RELEASE_KEY_PASSWORD != '' }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
      - name: Upload signed production release
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_STORE_PASSWORD != '' && env.RELEASE_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LivingDexHub-v1.4.0-Production-Signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
