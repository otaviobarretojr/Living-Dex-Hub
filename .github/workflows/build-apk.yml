name: Build Living Dex Hub APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths: ['app/**','tools/**','data/**','docs/**','build.gradle','settings.gradle','.github/workflows/build-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.LIVINGDEX_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.LIVINGDEX_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: livingdex
      RELEASE_KEY_PASSWORD: ${{ secrets.LIVINGDEX_KEY_PASSWORD }}
      CANONICAL_FILE: app/src/main/assets/canonical/index.v7_14.xz.b64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Restore canonical production baseline
        run: base64 --decode "$CANONICAL_FILE" | xz -d > app/src/main/assets/index.html
      - name: Sync active runtime media
        run: |
          python3 tools/sync_pokemon_assets.py
          python3 tools/sync_ui_media_v4_5.py
          python3 tools/ensure_pokemon_manifest_v7_14.py
      - name: Build and embed offline Pokemon core
        run: |
          python3 tools/build_offline_pokemon_core.py
          python3 tools/embed_offline_core.py
      - name: Apply Phase 5 product baseline
        run: |
          python3 tools/canonicalize_runtime_v7_14.py
          python3 tools/apply_home_premium_f1.py
      - name: Validate application and journeys
        run: |
          python3 tools/validate_core1.py
          python3 tools/validate_all_dexes_v7_13.py
          python3 tools/validate_canonical_v7_14.py
          python3 tools/validate_home_premium_f1.py
          python3 tools/audit_offline_pokemon_core.py
          python3 tools/audit_runtime_budget.py
          node tools/journey_reliability_harness.js
          python3 tools/validate_swsh_f78.py
          python3 tools/audit_swsh_missing_routes.py
          python3 tools/validate_bdsp_f80.py
          python3 tools/validate_livingdex_f113.py
          python3 tools/validate_livingdex_f115.py
          python3 tools/validate_ui_f1151.py
          grep -q "versionName '7.22.8'" app/build.gradle
          grep -q 'versionCode 152' app/build.gradle
          for F in game-context-v8.js game-selector-v8.js home-v8.js pokemon-offline-core-data-v8.js pokemon-offline-core-v8.js pokemon-detail-v8.js pokemon-evolution-v8.js pokemon-data-v8.js pokemon-about-v8.js pokemon-visual-quality-v8.js collection-reliability-v8.js product-ux-v8.js livingdex-global-v8.js livingdex-experience-v8.js national-livingdex-v8.js ui-stability-f1151.js letsgo-encounters-v8.js swsh-encounters-v8.js bdsp-encounters-v8.js pla-encounters-v8.js sv-encounters-v8.js za-encounters-v8.js acquisition-provider-registry-v8.js acquisition-availability-bridge-v8.js livingdex-encounter-guide-v8.js swsh-dex-scope-ui-v8.js; do node --check "app/src/main/assets/$F"; done
          grep -q "version:'8.0-f11.6'" app/src/main/assets/national-livingdex-v8.js
          grep -q 'standalonePage:true' app/src/main/assets/national-livingdex-v8.js
          grep -q 'providerAvailability:true' app/src/main/assets/national-livingdex-v8.js
          grep -q 'for(let id=1;id<=TOTAL;id++)' app/src/main/assets/national-livingdex-v8.js
          grep -q 'Onde está disponível' app/src/main/assets/national-livingdex-v8.js
          grep -q "version:'8.0-f11.6'" app/src/main/assets/ui-stability-f1151.js
          grep -q 'standaloneNationalDexRoute:true' app/src/main/assets/ui-stability-f1151.js
          grep -q 'national-livingdex-v8.js' app/src/main/assets/collection-reliability-v8.js
          grep -q 'national-livingdex-v8.css' app/src/main/assets/collection-reliability-v8.js
          test -f app/src/main/assets/national-livingdex-v8.css
          test -f app/src/main/assets/assets/pokemon/915.png
          ! grep -q 'ld842Search' app/src/main/assets/product-ux-v8.js
      - name: Final Android release audit
        run: python3 tools/android_release_audit.py
      - name: Seal validation marker
        run: python3 -c "from pathlib import Path;p=Path('app/src/main/assets/index.html');s=p.read_text();p.write_text(s.replace('const BUILD_QA_VALIDATED=false;','const BUILD_QA_VALIDATED=true;',1))"
      - name: Build APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Verify APK payloads
        run: |
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            test "$(zipinfo -1 "$APK"|grep -E '^assets/assets/pokemon/[0-9]+\.png$'|wc -l)" -eq 1025
            unzip -p "$APK" assets/index.html|grep -q 'BUILD_QA_VALIDATED=true'
            unzip -p "$APK" assets/national-livingdex-v8.js|grep -q "version:'8.0-f11.6'"
            unzip -p "$APK" assets/national-livingdex-v8.js|grep -q 'standalonePage:true'
            unzip -p "$APK" assets/national-livingdex-v8.js|grep -q 'Onde está disponível'
            unzip -p "$APK" assets/ui-stability-f1151.js|grep -q 'standaloneNationalDexRoute:true'
            unzip -p "$APK" assets/collection-reliability-v8.js|grep -q 'national-livingdex-v8.js'
            unzip -p "$APK" assets/pokemon-offline-core-v8.json|python3 -c "import sys,json;x=json.load(sys.stdin);assert x['count']==1025 and len(x['pokemon'])==1025 and '915' in x['pokemon']"
          done
      - name: Prepare production keystore
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_PASSWORD"
          echo "$RELEASE_KEYSTORE_BASE64"|base64 --decode > "$RUNNER_TEMP/livingdex-production.jks"
          chmod 600 "$RUNNER_TEMP/livingdex-production.jks"
      - name: Build signed production release
        env: { RELEASE_STORE_FILE: '${{ runner.temp }}/livingdex-production.jks' }
        run: rm -f app/build/outputs/apk/release/app-release.apk && gradle :app:assembleRelease --rerun-tasks --stacktrace && test -f app/build/outputs/apk/release/app-release.apk
      - name: Verify production APK
        run: |
          A=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f|sort -V|tail -1)
          "$A" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          test "$(zipinfo -1 app/build/outputs/apk/release/app-release.apk|grep -E '^assets/assets/pokemon/[0-9]+\.png$'|wc -l)" -eq 1025
          unzip -p app/build/outputs/apk/release/app-release.apk assets/index.html|grep -q 'BUILD_QA_VALIDATED=true'
          unzip -p app/build/outputs/apk/release/app-release.apk assets/national-livingdex-v8.js|grep -q "version:'8.0-f11.6'"
          unzip -p app/build/outputs/apk/release/app-release.apk assets/national-livingdex-v8.js|grep -q 'providerAvailability:true'
          unzip -p app/build/outputs/apk/release/app-release.apk assets/ui-stability-f1151.js|grep -q 'standaloneNationalDexRoute:true'
          unzip -p app/build/outputs/apk/release/app-release.apk assets/za-encounters-v8.js|grep -q '"coveredSpecies":364'
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LivingDexHub-v7.22.8-F11.6-NationalDex-Signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
