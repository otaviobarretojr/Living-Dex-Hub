name: Build Living Dex APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths: ['app/**','tools/**','data/**','build.gradle','settings.gradle','.github/workflows/build-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.LIVINGDEX_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.LIVINGDEX_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: livingdex
      RELEASE_KEY_PASSWORD: ${{ secrets.LIVINGDEX_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Restore canonical app HTML
        run: |
          python3 - <<'PY'
          import gzip,base64,pathlib
          root=pathlib.Path('app/src/main/assets');parts=[root/'index.part00',root/'index.part01x0',root/'index.part01x1',root/'index.part01x2',root/'index.part01x3',root/'index.part02',root/'index.part03',root/'index.part04']
          packed=''.join(p.read_text().strip() for p in parts);(root/'index.html').write_bytes(gzip.decompress(base64.b64decode(packed)))
          PY
      - name: Assemble app content
        run: |
          python3 tools/build_embedded_dex_pack.py
          python3 tools/inject_embedded_dex_pack.py
          python3 tools/sync_pokemon_assets.py
          python3 tools/sync_ui_media_v4_5.py
          python3 tools/finalize_core1.py
          python3 tools/patch_core1_runtime_qa.py
          python3 tools/rework_ui_v1.py
          python3 tools/rework_ui_v1_2.py
          python3 tools/rework_ui_v1_3.py
          python3 tools/rework_ui_v1_4.py
          python3 tools/rework_ui_v1_5.py
          python3 tools/patch_quick_toggle_v1_5_1.py
          python3 tools/rework_ui_v1_6.py
          python3 tools/rework_journey_v1_7.py
          python3 tools/rework_journey_v1_8.py
          python3 tools/rework_journey_v1_9.py
          python3 tools/patch_journey_v1_9_ceruledge.py
          python3 tools/rework_map_v2_0.py
          python3 tools/rework_navigation_v2_1.py
          python3 tools/rework_audio_v2_2.py
          python3 tools/fix_game_dex_v2_2_1.py
          python3 tools/rework_general_library_v2_3.py
          python3 tools/fix_general_dex_routing_v2_3_1.py
          python3 tools/fix_home_journey_v2_3_2.py
          python3 tools/cleanup_explanatory_copy_v2_4.py
          python3 tools/audio_always_on_v2_5.py
          python3 tools/rework_visual_v3.py
          python3 tools/polish_visual_v3_1.py
          python3 tools/clean_home_v3_1_1.py
          python3 tools/rework_reference_v4.py
          python3 tools/fix_reference_v4_runtime_qa.py
          python3 tools/rework_reference_structure_v4_1.py
          python3 tools/polish_menu_fonts_v4_1.py
          python3 tools/rework_dedicated_journey_pages_v4_2.py
          python3 tools/patch_ref42_runtime_qa.py
          python3 tools/rework_map_interaction_v4_3.py
          python3 tools/patch_ref43_runtime_qa.py
          python3 tools/polish_secondary_screens_v4_4.py
          python3 tools/rework_reference_faithful_v4_5.py
          python3 tools/polish_current_game_star_v4_5_1.py
          python3 tools/rework_library_reference_v4_6.py
          python3 tools/rework_paldea_correct_order_v4_9.py
      - name: Validate static structure and regressions
        run: |
          python3 tools/validate_core1.py
          python3 tools/validate_ui_v1_6.py
          python3 tools/validate_journey_v1_9.py
          python3 tools/validate_map_v2_0.py
          python3 tools/validate_navigation_v2_1.py
          python3 tools/validate_audio_v2_2.py
          python3 tools/validate_general_library_v2_3.py
          python3 tools/validate_home_journey_v2_3_2.py
          python3 tools/validate_reference_v4.py
          python3 tools/validate_reference_structure_v4_1.py
          python3 tools/validate_dedicated_journey_v4_2.py
          python3 tools/validate_map_v4_3.py
          python3 tools/validate_reference_faithful_v4_5.py
          python3 tools/validate_paldea_correct_order_v4_9.py
          test "$(find app/src/main/assets/assets/ui45 -type f | wc -l)" -eq 8
          grep -q 'living-dex-reference-faithful" content="4.5"' app/src/main/assets/index.html
          grep -q 'living-dex-current-game-star" content="4.5.1"' app/src/main/assets/index.html
          grep -q 'living-dex-library-reference" content="4.8"' app/src/main/assets/index.html
          grep -q 'living-dex-paldea-correct-order" content="4.9"' app/src/main/assets/index.html
          grep -q 'ldhAndroidResumeAudio' app/src/main/java/com/otaviobarreto/livingdex/MainActivity.java
          ! grep -q 'injectMobileLibraryFix' app/src/main/java/com/otaviobarreto/livingdex/MainActivity.java
          grep -q "versionName '4.9.0'" app/build.gradle
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('app/src/main/assets/index.html').read_text();pathlib.Path('/tmp/livingdex.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S)))
          PY
          node --check /tmp/livingdex.js
      - name: Browser QA
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"; python3 -m http.server 8000 --directory app/src/main/assets >/tmp/http.log 2>&1 & P=$!; trap 'kill $P || true' EXIT; sleep 2
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-background-networking --no-first-run --user-data-dir=/tmp/ldh --virtual-time-budget=18000 --dump-dom 'http://127.0.0.1:8000/index.html?qa=1&s44qa=1&r45qa=1&r451qa=1&v48qa=1&v49qa=1' >/tmp/qa.html
          grep -q 'data-qa-pass="1"' /tmp/qa.html
          grep -q 'data-s44-qa="1"' /tmp/qa.html
          grep -q 'data-r45-qa="1"' /tmp/qa.html
          grep -q 'data-r451-qa="1"' /tmp/qa.html
          grep -q 'data-v48-qa="1"' /tmp/qa.html
          grep -q 'data-v49-qa="1"' /tmp/qa.html
          grep -q 'assets/maps/paldea-correct-order.jpg' /tmp/qa.html
          grep -q 'assets/ui45/sv.jpg' /tmp/qa.html
          ! grep -q 'class="orb"' /tmp/qa.html
          timeout 35s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-background-networking --no-first-run --user-data-dir=/tmp/ldh-r42 --virtual-time-budget=11000 --dump-dom 'http://127.0.0.1:8000/index.html?ref42qa=1' >/tmp/r42.html
          grep -q 'data-ref42-qa="1"' /tmp/r42.html
          timeout 35s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-background-networking --no-first-run --user-data-dir=/tmp/ldh-r43 --virtual-time-budget=11000 --dump-dom 'http://127.0.0.1:8000/index.html?ref43qa=1' >/tmp/r43.html
          grep -q 'data-ref43-qa="1"' /tmp/r43.html
      - name: Audio runtime QA
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"; python3 -m http.server 8001 --directory app/src/main/assets >/tmp/http-audio.log 2>&1 & P=$!; trap 'kill $P || true' EXIT; sleep 2
          timeout 25s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-background-networking --no-first-run --user-data-dir=/tmp/ldh-audio --virtual-time-budget=7000 --dump-dom 'http://127.0.0.1:8001/index.html?audio25qa=1' >/tmp/audio.html
          grep -q 'data-audio25-qa="1"' /tmp/audio.html
      - name: Seal CI validation marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html');s=p.read_text();p.write_text(s.replace('const BUILD_QA_VALIDATED=false;','const BUILD_QA_VALIDATED=true;',1))
          PY
      - name: Build debug and unsigned release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Verify APK payloads
        run: |
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            test "$(zipinfo -1 "$APK"|grep -E '^assets/assets/pokemon/[0-9]+\.png$'|wc -l)" -eq 1025
            test "$(zipinfo -1 "$APK"|grep -E '^assets/assets/ui45/'|wc -l)" -eq 8
            zipinfo -1 "$APK"|grep -q '^assets/assets/maps/paldea-correct-order.jpg$'
            unzip -p "$APK" assets/index.html|grep -q 'living-dex-library-reference" content="4.8"'
            unzip -p "$APK" assets/index.html|grep -q 'living-dex-paldea-correct-order" content="4.9"'
            unzip -p "$APK" assets/index.html|grep -q 'BUILD_QA_VALIDATED=true'
          done
      - name: Prepare private production keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_STORE_PASSWORD != '' && env.RELEASE_KEY_PASSWORD != '' }}
        run: echo "$RELEASE_KEYSTORE_BASE64"|base64 --decode > "$RUNNER_TEMP/livingdex-production.jks" && chmod 600 "$RUNNER_TEMP/livingdex-production.jks"
      - name: Build signed production release
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_STORE_PASSWORD != '' && env.RELEASE_KEY_PASSWORD != '' }}
        env: { RELEASE_STORE_FILE: '${{ runner.temp }}/livingdex-production.jks' }
        run: rm -f app/build/outputs/apk/release/app-release.apk && gradle :app:assembleRelease --rerun-tasks --stacktrace && test -f app/build/outputs/apk/release/app-release.apk
      - name: Verify production APK
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_STORE_PASSWORD != '' && env.RELEASE_KEY_PASSWORD != '' }}
        run: |
          A=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f|sort -V|tail -1); "$A" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          test "$(zipinfo -1 app/build/outputs/apk/release/app-release.apk|grep -E '^assets/assets/pokemon/[0-9]+\.png$'|wc -l)" -eq 1025
          zipinfo -1 app/build/outputs/apk/release/app-release.apk|grep -q '^assets/assets/maps/paldea-correct-order.jpg$'
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
      - name: Upload production signed v4.9.0
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_STORE_PASSWORD != '' && env.RELEASE_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LivingDexHub-v4.9.0-Production-Signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
