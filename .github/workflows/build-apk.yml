name: Build Living Dex APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'data/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore canonical app HTML
        run: |
          python3 - <<'PY'
          import gzip, base64, pathlib
          root=pathlib.Path('app/src/main/assets')
          parts=[
              root/'index.part00',
              root/'index.part01x0', root/'index.part01x1', root/'index.part01x2', root/'index.part01x3',
              root/'index.part02', root/'index.part03', root/'index.part04'
          ]
          sizes=[p.stat().st_size for p in parts]
          assert sizes == [20000,6500,6500,6500,500,20000,20000,864], f'Unexpected part sizes: {sizes}'
          packed=''.join(p.read_text().strip() for p in parts)
          assert len(packed) == 80864, f'Unexpected Base64 length: {len(packed)}'
          out=root/'index.html'
          out.write_bytes(gzip.decompress(base64.b64decode(packed)))
          assert out.stat().st_size == 223467, f'Unexpected HTML size: {out.stat().st_size}'
          print('Restored', out, out.stat().st_size, 'bytes')
          PY

      - name: Build complete offline Pokédex Data Pack
        run: python3 tools/build_embedded_dex_pack.py

      - name: Inject all 12 Pokédexes into app
        run: python3 tools/inject_embedded_dex_pack.py

      - name: Package and validate 1025 Pokemon sprites
        run: python3 tools/sync_pokemon_assets.py

      - name: Finalize Core 1.0 logic and mobile UI
        run: python3 tools/finalize_core1.py

      - name: Update runtime QA for complete offline pack
        run: python3 tools/patch_core1_runtime_qa.py

      - name: Static Core 1.0 validation
        run: python3 tools/validate_core1.py

      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('app/src/main/assets/index.html').read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S)
          pathlib.Path('/tmp/livingdex.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/livingdex.js

      - name: Browser QA and persistence reopen test
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          python3 -m http.server 8000 --directory app/src/main/assets >/tmp/livingdex-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          "$CHROME" --headless=new --no-sandbox --disable-gpu --user-data-dir=/tmp/livingdex-profile --virtual-time-budget=14000 --dump-dom 'http://127.0.0.1:8000/index.html?qa=1' >/tmp/livingdex-qa.html
          if ! grep -q 'data-qa-pass="1"' /tmp/livingdex-qa.html; then
            echo 'Runtime smoke failed. QA result:'
            grep -A120 -B5 'id="qaResult"' /tmp/livingdex-qa.html || true
            exit 1
          fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --user-data-dir=/tmp/livingdex-profile --virtual-time-budget=5000 --dump-dom 'http://127.0.0.1:8000/index.html?reopen=1' >/tmp/livingdex-reopen.html
          grep -q 'data-reopen-pass="1"' /tmp/livingdex-reopen.html
          echo 'Browser QA: PASS'
          echo 'Persistence after browser reopen: PASS'

      - name: Seal CI validation marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          old='const BUILD_QA_VALIDATED=false;'
          assert old in s
          p.write_text(s.replace(old,'const BUILD_QA_VALIDATED=true;',1))
          PY
          python3 tools/validate_core1.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK payload
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          COUNT=$(zipinfo -1 "$APK" | grep -E '^assets/assets/pokemon/[0-9]+\.png$' | wc -l)
          test "$COUNT" -eq 1025
          unzip -p "$APK" assets/index.html | grep -q 'BUILD_QA_VALIDATED=true'
          unzip -p "$APK" assets/index.html | grep -q 'za:hyperspace'
          echo "APK payload validated: 1025 Pokemon sprites + Core 1.0 HTML"

      - name: Generate SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: LivingDexHub-Core-1.0-Validated
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
