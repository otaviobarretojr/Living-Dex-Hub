name: Build Living Dex Hub APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'app/build.gradle'
      - 'app/BUILD_TRIGGER.txt'
      - 'app/src/main/java/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/assets/canonical/**'
      - 'app/src/main/assets/design-system-v8.css'
      - 'app/src/main/assets/home-v8.css'
      - 'app/src/main/assets/home-v8.js'
      - 'app/src/main/assets/game-context-v8.js'
      - 'app/src/main/assets/game-selector-v8.css'
      - 'app/src/main/assets/game-selector-v8.js'
      - 'app/src/main/assets/shell-v8.css'
      - 'app/src/main/assets/assets/maps/**'
      - 'tools/canonicalize_runtime_v7_14.py'
      - 'tools/apply_home_premium_f1.py'
      - 'tools/validate_home_premium_f1.py'
      - 'tools/sync_pokemon_assets.py'
      - 'tools/sync_ui_media_v4_5.py'
      - 'tools/ensure_pokemon_manifest_v7_14.py'
      - 'tools/validate_core1.py'
      - 'tools/validate_all_dexes_v7_13.py'
      - 'tools/validate_canonical_v7_14.py'
      - 'data/**'
      - 'docs/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.LIVINGDEX_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.LIVINGDEX_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: livingdex
      RELEASE_KEY_PASSWORD: ${{ secrets.LIVINGDEX_KEY_PASSWORD }}
      CANONICAL_FILE: app/src/main/assets/canonical/index.v7_14.xz.b64
      DEX_PACK_FILE: data/embedded-dex-pack.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Restore canonical production baseline
        run: |
          test -f "$CANONICAL_FILE"; test -f "$DEX_PACK_FILE"
          base64 --decode "$CANONICAL_FILE" | xz -d > app/src/main/assets/index.html
      - name: Sync active runtime media
        run: |
          python3 tools/sync_pokemon_assets.py
          python3 tools/sync_ui_media_v4_5.py
          python3 tools/ensure_pokemon_manifest_v7_14.py
      - name: Apply idempotent canonical guard
        run: python3 tools/canonicalize_runtime_v7_14.py
      - name: Apply Phase F2.5.1
        run: python3 tools/apply_home_premium_f1.py
      - name: Validate application and all Pokedexes
        run: |
          python3 tools/validate_core1.py
          python3 tools/validate_all_dexes_v7_13.py
          python3 tools/validate_canonical_v7_14.py
          python3 tools/validate_home_premium_f1.py
          grep -q "versionName '7.16.7'" app/build.gradle
          grep -q "version:'8.0-f2.5.1'" app/src/main/assets/game-context-v8.js
          grep -q "version:'8.0-f2.5'" app/src/main/assets/game-selector-v8.js
          grep -q 'boxRuntimeStaysActiveWhileOpen:true' app/src/main/assets/game-context-v8.js
          grep -q 'ld813SetBoxGame=setBoxGame' app/src/main/assets/game-context-v8.js
          grep -q "text.includes('meus jogos')" app/src/main/assets/game-context-v8.js
          grep -q "ld82OpenBoxSelector=()=>open('box')" app/src/main/assets/game-selector-v8.js
          grep -q 'ld813SetBoxGame?.(id,{open:true})' app/src/main/assets/game-selector-v8.js
          grep -q 'visual-only' app/src/main/assets/home-v8.js
          node --check app/src/main/assets/home-v8.js
          node --check app/src/main/assets/game-context-v8.js
          node --check app/src/main/assets/game-selector-v8.js
      - name: Seal validation marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html');s=p.read_text();p.write_text(s.replace('const BUILD_QA_VALIDATED=false;','const BUILD_QA_VALIDATED=true;',1))
          PY
      - name: Build APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Verify APK payloads
        run: |
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            test "$(zipinfo -1 "$APK"|grep -E '^assets/assets/pokemon/[0-9]+\.png$'|wc -l)" -eq 1025
            unzip -p "$APK" assets/index.html|grep -q 'BUILD_QA_VALIDATED=true'
            unzip -p "$APK" assets/index.html|grep -q 'F2.5-independent'
            unzip -p "$APK" assets/game-context-v8.js|grep -q "version:'8.0-f2.5.1'"
            unzip -p "$APK" assets/game-context-v8.js|grep -q 'boxRuntimeStaysActiveWhileOpen:true'
            unzip -p "$APK" assets/game-selector-v8.js|grep -q "version:'8.0-f2.5'"
            unzip -p "$APK" assets/game-selector-v8.js|grep -q "ld82OpenBoxSelector=()=>open('box')"
            unzip -p "$APK" assets/home-v8.js|grep -q 'visual-only'
          done
      - name: Prepare production keystore
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"; test -n "$RELEASE_STORE_PASSWORD"; test -n "$RELEASE_KEY_PASSWORD"
          echo "$RELEASE_KEYSTORE_BASE64"|base64 --decode > "$RUNNER_TEMP/livingdex-production.jks"
          chmod 600 "$RUNNER_TEMP/livingdex-production.jks"
      - name: Build signed production release
        env: { RELEASE_STORE_FILE: '${{ runner.temp }}/livingdex-production.jks' }
        run: rm -f app/build/outputs/apk/release/app-release.apk && gradle :app:assembleRelease --rerun-tasks --stacktrace && test -f app/build/outputs/apk/release/app-release.apk
      - name: Verify production APK
        run: |
          A=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f|sort -V|tail -1)
          "$A" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          test "$(zipinfo -1 app/build/outputs/apk/release/app-release.apk|grep -E '^assets/assets/pokemon/[0-9]+\.png$'|wc -l)" -eq 1025
          unzip -p app/build/outputs/apk/release/app-release.apk assets/index.html|grep -q 'BUILD_QA_VALIDATED=true'
          unzip -p app/build/outputs/apk/release/app-release.apk assets/index.html|grep -q 'F2.5-independent'
          unzip -p app/build/outputs/apk/release/app-release.apk assets/game-context-v8.js|grep -q "version:'8.0-f2.5.1'"
          unzip -p app/build/outputs/apk/release/app-release.apk assets/game-context-v8.js|grep -q 'boxRuntimeStaysActiveWhileOpen:true'
          unzip -p app/build/outputs/apk/release/app-release.apk assets/game-selector-v8.js|grep -q "ld82OpenBoxSelector=()=>open('box')"
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LivingDexHub-v7.16.7-F2.5.1-Production-Signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
